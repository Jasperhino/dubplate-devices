[package]
name = "dubplate-devices"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A small macOS menu-bar controller for Dubplate's experimental device emulators"

[dependencies]
midir = "=0.10.3"
getrandom = "0.3"
libc = "0.2"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
